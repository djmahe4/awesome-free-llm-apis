name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'external/agent-prompt/README.md'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test MCP Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      contents: read

    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          # onnxruntime-node downloads CUDA binaries from a Microsoft host at install time; this runner is CPU-only and the download times out intermittently
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: mcp-server/coverage/
          if-no-files-found: ignore
