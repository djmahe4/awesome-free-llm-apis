  <!-- ─── DSP Effect Modal ──────────────────────────────────────── -->
  <div id="movie-fx-modal" class="modal-backdrop" role="dialog" aria-modal="true" style="display:none;align-items:center;justify-content:center;">
    <div class="modal-card" style="max-width:480px;">
      <div class="modal-header">
        <div>
          <h3 class="modal-title">DSP Audio/Video FX Processor</h3>
          <span id="fx-artifact-title" class="badge badge-cyan" style="font-size:0.65rem;">Slot Modifier</span>
        </div>
        <button id="movie-fx-close-btn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" style="padding:16px;">
        <div style="margin-bottom:12px;">
          <label class="field-label">Effect Type</label>
          <select id="fx-type-select" class="session-input" style="width:100%;">
            <option value="reverb">Reverb / Spatial Room Simulation</option>
            <option value="pitch">Pitch Shift (Semitones)</option>
            <option value="lut">Color LUT (Grading)</option>
            <option value="eq">3-Band Equalizer (Bass/Mid/Treble)</option>
            <option value="tempo">Tempo Warp</option>
          </select>
        </div>

        <div id="fx-reverb-controls">
          <div style="margin-bottom:10px;">
            <label class="field-label">Macro Preset</label>
            <select id="fx-preset-select" class="session-input" style="width:100%;">
              <option value="studio">Studio Room (Tight &amp; Clear)</option>
              <option value="cathedral">Cathedral (Deep Reverberation)</option>
              <option value="canyon">Canyon Echo (Long Slapback)</option>
              <option value="lofi">Lo-Fi Vintage Space</option>
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;">
            <div>
              <label class="field-label">Wet / Dry Mix (<span id="fx-wet-val">80%</span>)</label>
              <input type="range" id="fx-wet-slider" min="10" max="100" value="80" style="width:100%;">
            </div>
            <div>
              <label class="field-label">Decay Length (<span id="fx-decay-val">0.4s</span>)</label>
              <input type="range" id="fx-decay-slider" min="1" max="50" value="4" style="width:100%;">
            </div>
          </div>
        </div>

        <div id="fx-pitch-controls" style="margin-bottom:12px;display:none;">
          <label class="field-label">Pitch Shift: <span id="fx-semitone-val">0 semitones</span></label>
          <input type="range" id="fx-semitone-slider" min="-12" max="12" value="0" style="width:100%;">
        </div>

        <div id="fx-eq-controls" style="margin-bottom:12px;display:none;">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
            <div>
              <label class="field-label">Bass (<span id="fx-bass-val">0dB</span>)</label>
              <input type="range" id="fx-bass-slider" min="-12" max="12" value="0" style="width:100%;">
            </div>
            <div>
              <label class="field-label">Mid (<span id="fx-mid-val">0dB</span>)</label>
              <input type="range" id="fx-mid-slider" min="-12" max="12" value="0" style="width:100%;">
            </div>
            <div>
              <label class="field-label">Treble (<span id="fx-treble-val">0dB</span>)</label>
              <input type="range" id="fx-treble-slider" min="-12" max="12" value="0" style="width:100%;">
            </div>
          </div>
        </div>

        <div id="fx-tempo-controls" style="margin-bottom:12px;display:none;">
          <label class="field-label">Tempo Speed Warp: <span id="fx-tempo-val">1.0x</span></label>
          <input type="range" id="fx-tempo-slider" min="5" max="20" value="10" step="1" style="width:100%;">
          <div style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;">0.5x (half-speed) to 2.0x (double-speed) with atempo pitch compensation.</div>
        </div>

        <div id="fx-lut-controls" style="margin-bottom:12px;display:none;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label class="field-label">Contrast: <span id="fx-contrast-val">1.25</span></label>
              <input type="range" id="fx-contrast-slider" min="5" max="25" value="12" style="width:100%;">
            </div>
            <div>
              <label class="field-label">Saturation: <span id="fx-saturation-val">1.3</span></label>
              <input type="range" id="fx-saturation-slider" min="5" max="25" value="13" style="width:100%;">
            </div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px;">
          <button id="movie-fx-undo-btn" class="btn btn-secondary btn-sm">↺ Undo Last FX</button>
          <button id="movie-fx-apply-btn" class="btn btn-primary btn-sm">Apply FX &amp; Remix</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Tool Documentation Modal ──────────────────────────────── -->
  <div id="tool-docs-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-tool-title" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <span id="modal-tool-icon" style="font-size:1.4rem;">📖</span>
          <div>
            <h3 id="modal-tool-title" class="modal-title">Tool Documentation</h3>
            <span id="modal-tool-tag" class="badge badge-purple" style="font-size:0.65rem;">Reference</span>
          </div>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-when-to-use" id="modal-when-to-use"></div>
      <div class="modal-body" id="modal-tool-body">
        <div class="conv-empty">Loading documentation…</div>
      </div>
    </div>
  </div>
