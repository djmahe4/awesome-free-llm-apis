name: go
language: go
extensions:
  - .go
comments:
  doc_blocks:
    - pattern: "^[ \\t]*\\/\\*[\\s\\S]*?\\*\\/"
  single_line:
    - pattern: "^[ \\t]*\\/\\/[ \\t]*(.*)$"
sinks:
  - type: command_injection
    regex: "\\b(?:exec\\.Command|exec\\.CommandContext)\\b"
    pattern: "\\b(?:exec\\.Command|exec\\.CommandContext)\\b"
  - type: sql_injection
    regex: "\\b(?:db\\.Query|db\\.Exec)\\s*\\([^)]*\\+"
    pattern: "\\b(?:db\\.Query|db\\.Exec)\\s*\\([^)]*\\+"
  - type: unsafe_pointer
    regex: "\\bunsafe\\.Pointer\\b"
    pattern: "\\bunsafe\\.Pointer\\b"

symbols:
  - id: go-func-declaration
    kind: function
    pattern: "^func\\s+(?:\\([^)]+\\)\\s+)?([A-Za-z0-9_]+)\\s*\\(([^)]*)\\)"
    message: "Go function/method declaration"
  - id: go-struct-declaration
    kind: struct
    pattern: "^type\\s+([A-Za-z0-9_]+)\\s+struct\\b"
    message: "Go struct type declaration"
  - id: go-interface-declaration
    kind: interface
    pattern: "^type\\s+([A-Za-z0-9_]+)\\s+interface\\b"
    message: "Go interface type declaration"
  - id: go-import-statement
    kind: module
    pattern: "^import\\s+(?:\\(\\s*)?[\"']([A-Za-z0-9_./-]+)[\"']"
    message: "Go import statement"
  - id: go-memory-allocation
    kind: concept
    pattern: "\\b(?:make|new)\\s*\\(([^)]+)\\)"
    message: "Go memory allocation via make/new"
