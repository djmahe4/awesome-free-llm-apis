harness:
  name: research-analysis-harness
  schemaVersion: 1
  primaryLane: research
  budget:
    maxTokens: 60000
    maxToolCalls: 40
    maxWallMinutes: 20
    supervisorShareMax: 0.2
  # Unset/empty = unrestricted (any workspace_root a caller supplies is
  # accepted, matching coding_agents' current default posture). Set this to
  # scope every run under this declaration to specific project directories:
  # allowedWorkspaceRoots:
  #   - C:\Users\me\projects\my-project
  allowedWorkspaceRoots: []
  approval:
    timeoutMinutes: 60
    standingRules: []

roles:
  top_level:
    tools:
      - { tool: manage_memory, actions: [search, wiki_search, wiki_read, adr_list, eisenhower_list, node_list, graph_query] }
      - { tool: use_free_llm, constraints: { agentic: false } }
  researcher:
    triggers: [research, arxiv, paper, "pdf://", literature, survey, analysis]
    tools:
      - { tool: use_free_llm, constraints: { agentic: false } }
      - { tool: vision_tool }
  scraper:
    triggers: [scrape, extract, crawl, table, list]
    tools:
      - { tool: browser_tool, actions: [navigate, snapshot, extract, deep_scrape, screenshot, checkpoint, session] }
  analyst:
    triggers: [compare, synthesize, critique, "key findings", limitations]
    tools:
      - { tool: use_free_llm, constraints: { agentic: false } }
  coder:
    requiresApproval: true
    tools:
      - { tool: coding_agents }
      - { tool: local_llm_patch }

writes:
  - { tool: manage_memory, actions: [wiki_write, adr_write, node_add, node_link, node_review, eisenhower_add] }

contentDepth:
  order: [abstract, html, pdf]
  default: abstract

handoff:
  schemaVersion: 1
  lowConfidenceThreshold: 0.7
  maxDepth: 3
