name: Validate data

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Validate data.json
        run: node scripts/validate-data.js
      - name: README generates from data.json
        run: node scripts/generate-readme.js
