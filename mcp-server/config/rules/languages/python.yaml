name: python
language: python
extensions:
  - .py
sinks:
  - type: command_injection
    regex: "\\b(?:subprocess\\.(?:Popen|call|check_call|check_output|run)|os\\.system|os\\.popen)\\b"
    pattern: "\\b(?:subprocess\\.(?:Popen|call|check_call|check_output|run)|os\\.system|os\\.popen)\\b"
  - type: code_execution
    regex: "\\b(?:eval|exec)\\b"
    pattern: "\\b(?:eval|exec)\\b"
  - type: deserialization
    regex: "\\b(?:pickle\\.loads?|yaml\\.load)\\s*\\("
    pattern: "\\b(?:pickle\\.loads?|yaml\\.load)\\s*\\("

symbols:
  - id: py-function-def
    kind: function
    pattern: "^[ \\t]*(?:async\\s+)?def\\s+([A-Za-z0-9_]+)\\s*\\(([^)]*)\\)(?:\\s*->\\s*[^:]+)?:$"
    message: "Python function or method definition with optional return type"
  - id: py-class-def
    kind: class
    pattern: "^[ \\t]*class\\s+([A-Za-z0-9_]+)(?:\\s*\\(([^)]*)\\))?\\s*:"
    message: "Python class definition with inheritance"
  - id: py-decorator
    kind: decorator
    pattern: "^[ \\t]*@([A-Za-z0-9_\\.]+)(?:\\s*\\(([^)]*)\\))?"
    message: "Python decorator annotation"
  - id: py-variable-annotation
    kind: variable
    pattern: "^[ \\t]*([A-Za-z0-9_]+)\\s*:\\s*([A-Za-z0-9_\\[\\],\\s\\.]+)(?:\\s*=.*)?$"
    message: "Python type-annotated module or class attribute"
