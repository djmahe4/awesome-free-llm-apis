    <!-- ══════════════════════════════════════════════════════════
         TAB 3: TOOL PLAYGROUND
    ══════════════════════════════════════════════════════════ -->
    <section class="tab-panel" id="panel-playground" role="tabpanel" aria-labelledby="tab-playground">

      <div class="pg-chat-layout">

        <!-- LEFT: Tool Selector + Param Panel -->
        <div class="pg-sidebar" id="pg-sidebar">
          
          <!-- Conversations Card -->
          <div class="card" style="margin-bottom:12px; display:flex; flex-direction:column; max-height:280px; min-height:160px;">
            <div class="card-header" style="padding:10px 16px; flex-shrink:0; display:flex; justify-content:space-between; align-items:center;">
              <span class="card-title" style="font-size:.82rem; display:flex; align-items:center; gap:6px;">
                <span>🗂</span> Conversations
              </span>
              <button id="pg-new-conv-btn" class="btn btn-primary btn-sm" style="padding:2px 8px; font-size:.7rem; display:flex; align-items:center; gap:3px;" title="Start a new conversation">+ New</button>
            </div>
            <div class="card-body" style="padding:8px; display:flex; flex-direction:column; overflow:hidden; flex:1; min-height:0;">
              <input type="text" id="pg-conv-search" placeholder="Search sessions..." style="font-size:.75rem; padding:6px 10px; margin-bottom:8px; border-radius:6px; flex-shrink:0; width:100%; border:1px solid var(--glass-border); background:rgba(255,255,255,0.03); color:var(--text-primary);">
              <div id="pg-conv-list" class="conv-list" style="overflow-y:auto; flex:1; min-height:0; display:flex; flex-direction:column; gap:4px;">
                <div class="conv-empty">Loading conversations...</div>
              </div>
            </div>
          </div>

          <div class="card" style="margin-bottom:12px;">
            <div class="card-header" style="padding:12px 16px;">
              <span class="card-title" style="font-size:.82rem;">Select Tool</span>
            </div>
            <div class="card-body" style="padding:8px;">
              <div class="tool-selector-list" id="tool-list"></div>
            </div>
          </div>

          <!-- Params card -->
          <div class="card" id="pg-params-card">
            <div class="card-header" style="padding:10px 16px;cursor:pointer;" id="pg-params-toggle">
              <span class="card-title" id="pg-tool-title" style="font-size:.82rem;">use_free_llm</span>
              <svg id="pg-params-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform .2s;margin-left:auto;"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div id="pg-params-body" class="card-body" style="padding:12px;">
              <div id="pg-form" class="playground-form"></div>
            </div>
          </div>
        </div>

        <!-- RIGHT: Chat Log + Send Bar -->
        <div class="pg-chat-main">

          <!-- Chat header -->
          <div class="pg-chat-header">
            <div style="display:flex;flex-direction:column;gap:2px;">
              <span id="pg-chat-session-label" style="font-size:.8rem;color:var(--text-muted);">No workspace — one-shot mode</span>
              <span id="pg-chat-mode-badge" class="badge badge-amber" style="width:fit-content;font-size:.65rem;">⚡ One-shot</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <!-- Workspace input inline -->
              <div style="display:flex;gap:6px;align-items:center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);flex-shrink:0;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <input type="text" id="pg-workspace" placeholder="workspace path (enables memory/grounding)" style="width:220px;font-size:.78rem;" title="Set workspace root — saved automatically. Changing this starts a new conversation.">
                <button type="button" id="pg-folder-btn" class="btn btn-outline btn-sm" title="Pick workspace folder" style="padding:3px 7px;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </button>
              </div>
              <!-- Agentic is opt-in, independent of whether a workspace is set — workspace
                   memory/context grounding and file/pdf reference resolution both already
                   work without it. Agentic adds subtask decomposition + a pre-emptive
                   full-workspace re-index, which is unnecessary overhead (and can mangle
                   simple reference-only requests) unless you actually want multi-step
                   planning. -->
              <label style="display:flex;gap:5px;align-items:center;font-size:.78rem;color:var(--text-muted);cursor:pointer;" title="Enable subtask decomposition + pre-emptive workspace re-indexing. Leave off for simple grounded Q&A, including PDF/file/image references — those already work via the workspace above.">
                <input type="checkbox" id="pg-agentic-toggle" style="cursor:pointer;">
                🧠 Agentic
              </label>
              <button class="btn btn-outline btn-sm" id="pg-clear-btn" title="Clear conversation">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>
            </div>
          </div>

          <!-- Chat log -->
          <div class="pg-chat-log" id="pg-chat-log" aria-live="polite">
            <div class="chat-empty-state" id="pg-chat-empty">
              <div style="font-size:2rem;margin-bottom:8px;">🛠</div>
              <div style="font-weight:600;color:var(--text-primary);margin-bottom:4px;">Tool Playground</div>
              <div style="font-size:.8rem;color:var(--text-muted);max-width:320px;text-align:center;">Fill in params on the left and send a message. Set a workspace root above to enable agentic multi-step execution.</div>
            </div>
          </div>

          <!-- Attachments row -->
          <div class="pg-attachments" id="pg-attachments"></div>

          <!-- Send bar -->
          <div class="pg-send-bar">
            <input type="file" id="pg-file-input" accept="image/*,application/pdf" style="display:none;">
            <button class="btn btn-outline btn-sm" id="pg-attach-btn" title="Attach image or PDF">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <span id="pg-status" style="font-size:.72rem;color:var(--text-muted);"></span>
            <span id="pg-latency" class="latency-badge" style="display:none;"></span>
            <button class="btn btn-primary" id="pg-run-btn" style="margin-left:auto;gap:6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send
            </button>
          </div>
        </div>

      </div>
    </section>
